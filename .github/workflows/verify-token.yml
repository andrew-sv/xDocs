name: Verify Railway token

# Temporary: proves the RAILWAY_API_TOKEN secret authenticates. Deploys nothing.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Query the Railway project with the stored token
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "secret is empty or unset"; exit 1
          fi
          echo "secret is present (${#RAILWAY_API_TOKEN} chars)"
          # `me` is not available to API tokens, so query a project instead.
          RESP=$(curl -s -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
            -H 'content-type: application/json' \
            -d '{"query":"query{project(id:\"87b04a3a-fc12-437c-af98-e93dff66a801\"){name}}"}')
          echo "$RESP"
          echo "$RESP" | grep -q '"name":"xdocs-api"' \
            && echo "TOKEN VALID — can reach the xdocs-api project" \
            || { echo "TOKEN INVALID"; exit 1; }
