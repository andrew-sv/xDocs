name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests cannot drive Google OAuth, so the email+password provider is enabled
  # for CI only. Staging leaves this unset — Google is the only way in there.
  ALLOW_PASSWORD_LOGIN: 'true'
  VITE_ALLOW_PASSWORD_LOGIN: 'true'
  BETTER_AUTH_SECRET: ci-only-not-a-real-secret
  BETTER_AUTH_URL: http://localhost:3001
  # Vanilla Postgres is enough: the schema only needs gen_random_uuid(), which
  # is built in since PG13. So CI needs no Neon access and no secrets at all.
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/xdocs

jobs:
  checks:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # Pure logic plus jsdom-mounted editors — no database, no servers.
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Server integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xdocs
        ports: ['5432:5432']
        # Polled every 2s: the job waits on this check before its first step,
        # and at 10s it could sit out most of an interval after Postgres was
        # already up ("Initialize containers" took ~25s). 25 retries keeps the
        # old ~50s ceiling.
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # db:push runs through `dotenv -e ../../.env.local`, so the file has to
      # exist. Writing it also means every script works unchanged in CI.
      - name: Write .env.local
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "ALLOW_PASSWORD_LOGIN=$ALLOW_PASSWORD_LOGIN"
            echo "BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET"
            echo "BETTER_AUTH_URL=$BETTER_AUTH_URL"
          } > .env.local
          echo "VITE_ALLOW_PASSWORD_LOGIN=true" > apps/web/.env.local

      # Migrations, not a schema push: this is what proves the committed
      # migration chain builds the schema from empty on every PR.
      - run: pnpm db:migrate

      - name: Start the API and wait for it
        run: |
          pnpm -F @xdocs/api start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/health >/dev/null && exit 0
            sleep 1
          done
          echo "API did not become healthy in 60s"; exit 1

      - run: pnpm integration

  e2e:
    # Sharded because this is by far the longest job, and it cannot simply be
    # given more workers: one runner hosts the whole stack, and six browsers on
    # it is what #28 was about. Each shard is a separate runner with its own
    # Postgres, so they share nothing — which also means no shard may depend on
    # data another one makes. Raising the count means editing both `shard` and
    # `--shard`; they have to agree.
    name: Browser (Playwright) ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      # One shard failing should not hide a different failure in another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xdocs
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Write .env.local
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "ALLOW_PASSWORD_LOGIN=$ALLOW_PASSWORD_LOGIN"
            echo "BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET"
            echo "BETTER_AUTH_URL=$BETTER_AUTH_URL"
          } > .env.local
          echo "VITE_ALLOW_PASSWORD_LOGIN=true" > apps/web/.env.local

      # Migrations, not a schema push: this is what proves the committed
      # migration chain builds the schema from empty on every PR.
      - run: pnpm db:migrate

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm -F @xdocs/web exec playwright install --with-deps chromium

      # playwright.config.ts starts the dev servers itself when CI is set
      # (reuseExistingServer is false there), so nothing needs starting here.
      # `playwright test` directly, not `pnpm e2e -- --shard=...`: pnpm swallows
      # the forwarded flags there and every shard silently runs the whole suite.
      - run: pnpm -F @xdocs/web exec playwright test --shard=${{ matrix.shard }}/3

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Unique per shard: upload-artifact refuses to write a name twice.
          name: playwright-report-shard-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 7

  deploy:
    name: Deploy to staging
    # Only after every check passes, and only for a push to main — never a PR.
    needs: [checks, integration, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deliberately NOT cancel-in-progress: killing a half-finished deploy is
    # worse than queueing behind one.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://xdocs-andrew-svs-projects.vercel.app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The schema must be ready BEFORE new code starts against it, and a
      # destructive change must stop the pipeline rather than the database.
      - name: Check pending migrations
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: node apps/api/scripts/check-migrations.mjs

      - name: Apply migrations
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: pnpm -F @xdocs/api exec drizzle-kit migrate

      # Backend first: if the API fails to deploy there is no point shipping a
      # frontend that talks to it.
      - name: Deploy backend to Railway
        env:
          # An account token is not project-scoped, so the target is explicit.
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          npm i -g @railway/cli
          railway up \
            --ci \
            --project 87b04a3a-fc12-437c-af98-e93dff66a801 \
            --service xdocs-api \
            --environment production

      - name: Wait for the API to come back healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf https://xdocs-api-production.up.railway.app/health >/dev/null; then
              echo "API healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API did not report healthy within 60s"; exit 1

      - name: Deploy frontend to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Identifiers, not secrets — they tell the CLI which project to target.
          VERCEL_ORG_ID: team_x7WCOuF8utpn8hQ8qWokBh6M
          VERCEL_PROJECT_ID: prj_AHtf4LX8vmhi1rMnckWo1QOelvAc
        run: npx vercel@59.11.7 deploy --prod --yes --token "$VERCEL_TOKEN"

      # The real gate: proves the deployment is up AND that the password still
      # covers both the API and the websocket, not just the page.
      - name: Smoke test staging
        run: pnpm smoke https://xdocs-api-production.up.railway.app
