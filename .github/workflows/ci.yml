name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Vanilla Postgres is enough: the schema only needs gen_random_uuid(), which
  # is built in since PG13. So CI needs no Neon access and no secrets at all.
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/xdocs

jobs:
  checks:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Pure logic plus jsdom-mounted editors — no database, no servers.
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Server integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xdocs
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # db:push runs through `dotenv -e ../../.env.local`, so the file has to
      # exist. Writing it also means every script works unchanged in CI.
      - name: Write .env.local
        run: echo "DATABASE_URL=$DATABASE_URL" > .env.local

      - run: pnpm db:push

      - name: Start the API and wait for it
        run: |
          pnpm -F @xdocs/api start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/health >/dev/null && exit 0
            sleep 1
          done
          echo "API did not become healthy in 60s"; exit 1

      - run: pnpm integration

  e2e:
    name: Browser (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xdocs
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Write .env.local
        run: echo "DATABASE_URL=$DATABASE_URL" > .env.local

      - run: pnpm db:push

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm -F @xdocs/web exec playwright install --with-deps chromium

      # playwright.config.ts starts the dev servers itself when CI is set
      # (reuseExistingServer is false there), so nothing needs starting here.
      - run: pnpm e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
