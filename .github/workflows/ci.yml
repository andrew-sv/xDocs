name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests cannot drive Google OAuth, so the email+password provider is enabled
  # for CI only. Staging leaves this unset — Google is the only way in there.
  ALLOW_PASSWORD_LOGIN: 'true'
  VITE_ALLOW_PASSWORD_LOGIN: 'true'
  BETTER_AUTH_SECRET: ci-only-not-a-real-secret
  BETTER_AUTH_URL: http://localhost:3001
  # Vanilla Postgres is enough: the schema only needs gen_random_uuid(), which
  # is built in since PG13. So CI needs no Neon access and no secrets at all.
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/xdocs

jobs:
  checks:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Pure logic plus jsdom-mounted editors — no database, no servers.
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Server integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xdocs
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # db:push runs through `dotenv -e ../../.env.local`, so the file has to
      # exist. Writing it also means every script works unchanged in CI.
      - name: Write .env.local
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "ALLOW_PASSWORD_LOGIN=$ALLOW_PASSWORD_LOGIN"
            echo "BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET"
            echo "BETTER_AUTH_URL=$BETTER_AUTH_URL"
          } > .env.local
          echo "VITE_ALLOW_PASSWORD_LOGIN=true" > apps/web/.env.local

      - run: pnpm db:push

      - name: Start the API and wait for it
        run: |
          pnpm -F @xdocs/api start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/health >/dev/null && exit 0
            sleep 1
          done
          echo "API did not become healthy in 60s"; exit 1

      - run: pnpm integration

  e2e:
    name: Browser (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xdocs
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Write .env.local
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "ALLOW_PASSWORD_LOGIN=$ALLOW_PASSWORD_LOGIN"
            echo "BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET"
            echo "BETTER_AUTH_URL=$BETTER_AUTH_URL"
          } > .env.local
          echo "VITE_ALLOW_PASSWORD_LOGIN=true" > apps/web/.env.local

      - run: pnpm db:push

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm -F @xdocs/web exec playwright install --with-deps chromium

      # playwright.config.ts starts the dev servers itself when CI is set
      # (reuseExistingServer is false there), so nothing needs starting here.
      - run: pnpm e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  deploy:
    name: Deploy to staging
    # Only after every check passes, and only for a push to main — never a PR.
    needs: [checks, integration, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deliberately NOT cancel-in-progress: killing a half-finished deploy is
    # worse than queueing behind one.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://xdocs-andrew-svs-projects.vercel.app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Backend first: if the API fails to deploy there is no point shipping a
      # frontend that talks to it.
      - name: Deploy backend to Railway
        env:
          # An account token is not project-scoped, so the target is explicit.
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          npm i -g @railway/cli
          railway up \
            --ci \
            --project 87b04a3a-fc12-437c-af98-e93dff66a801 \
            --service xdocs-api \
            --environment production

      - name: Wait for the API to come back healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf https://xdocs-api-production.up.railway.app/health >/dev/null; then
              echo "API healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API did not report healthy within 60s"; exit 1

      - name: Deploy frontend to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Identifiers, not secrets — they tell the CLI which project to target.
          VERCEL_ORG_ID: team_x7WCOuF8utpn8hQ8qWokBh6M
          VERCEL_PROJECT_ID: prj_AHtf4LX8vmhi1rMnckWo1QOelvAc
        run: npx vercel@59.11.7 deploy --prod --yes --token "$VERCEL_TOKEN"

      # The real gate: proves the deployment is up AND that the password still
      # covers both the API and the websocket, not just the page.
      - name: Smoke test staging
        run: pnpm smoke https://xdocs-api-production.up.railway.app
